<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Patrón · Cemitas a domicilio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;800&display=swap">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{--red:#9d1415;--red2:#7a0f10;--ink:#2B1210;--cream:#FFF4E3;--pink:#F6AAB4;--gold:#F0B13B;--green:#5E8C32;--card:#FFF4E3;--muted:#7A4A44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#9d1415;--red2:#7a0f10;--card:#F3E6D2;color-scheme:dark}}
:root[data-theme="dark"]{--red:#9d1415;--red2:#7a0f10;--card:#F3E6D2}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 82px)}
*{box-sizing:inherit;margin:0}
body{background:var(--red) radial-gradient(circle at 20% 10%,rgba(255,255,255,.08),transparent 40%);font-family:Nunito,system-ui,sans-serif;font-weight:600;color:var(--ink);padding-bottom:24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:30}
main{max-width:520px;margin:0 auto;padding:30px 14px 40px;display:grid;gap:44px}
h1,h2{font-family:'Titan One',Impact,sans-serif;font-weight:400}
h1{color:var(--cream);font-size:2.2rem;line-height:1;text-align:center}
.sub{color:var(--cream);text-align:center;margin-top:-6px}
.pigwrap{height:104px;overflow:hidden;display:flex;justify-content:center;pointer-events:none;margin-bottom:-24px}
.pigwrap img{width:150px;height:auto;align-self:flex-start}
.card{position:relative;z-index:1;background:var(--card);border-radius:18px;padding:14px;border:3px solid var(--ink)}
h2{font-size:1.3rem;margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #c9a58f}
.row small{display:block;color:var(--muted)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--gold);font-size:1.4rem;font-weight:800;color:var(--ink)}
.step b{min-width:24px;text-align:center;font-size:1.2rem}
.chips{display:flex;gap:6px;margin:8px 0}
.chip{flex:1 1 0;min-width:0;padding:11px 4px;border-radius:12px;border:2px solid var(--ink);background:transparent;font:inherit;font-weight:800;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--cream)}
.f{width:100%;padding:12px;border-radius:12px;border:2px solid var(--ink);background:#fff;font:inherit;font-weight:700;color:var(--ink);margin-top:8px}
.total{display:flex;justify-content:space-between;align-items:center;font-family:'Titan One',Impact,sans-serif;font-size:1.6rem;margin:10px 0}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:3px solid var(--ink);background:var(--green);color:#fff;font:inherit;font-weight:800;font-size:1.05rem;text-align:center;text-decoration:none}
.btn.alt{background:var(--pink);color:var(--ink)}
.note{background:var(--gold);border:2px solid var(--ink);border-radius:12px;padding:10px;margin-top:10px;font-size:.95rem}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{display:flex;align-items:center;gap:10px}.chef{width:44%;max-width:190px;height:auto;flex:none}.hero h1{text-align:left;font-size:2rem}.hero .sub{text-align:left;margin-top:8px;font-size:1.15rem}

.logo{display:block;width:100%;max-width:640px;margin:20px auto 0;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.logo img{display:block;width:100%;height:auto}
.photo{display:block;width:100%;height:auto;border-radius:18px;border:3px solid var(--ink)}
.sec{display:grid;gap:10px}
.hero{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 14px}
.hero .sub{color:var(--ink);font-family:'Titan One',Impact,sans-serif;font-weight:400;font-size:1.25rem;line-height:1.15;margin:0;text-align:left}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;height:72px;background:#fff;border-bottom:3px solid var(--ink);display:flex;justify-content:center;align-items:center;overflow:hidden}
.top img{height:62px;width:auto;display:block}
#pedido{scroll-margin-top:90px}
.rv{transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.js .rv{opacity:0;transform:translateY(34px) scale(.97)}
.js .rv.l{transform:translateX(-46px)}
.js .rv.r{transform:translateX(46px)}
.js .rv.z{transform:scale(.88)}
.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{transition:none}.js .rv,.js .rv.l,.js .rv.r,.js .rv.z{opacity:1;transform:none}}
#go{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;width:auto;padding:13px 20px;box-shadow:0 4px 0 var(--ink);transition:opacity .3s}
#go.off{opacity:0;pointer-events:none}</style>
</head>

<section class="card rv" id="pedido">
<h2>Arma tu pedido</h2>
<div id="menu"></div>
<div class="chips"><button class="chip on" data-m="domicilio">A domicilio</button><button class="chip" data-m="recoger">Paso a recoger</button></div>
<input class="f" id="nombre" placeholder="Tu nombre" autocomplete="name">
<textarea class="f" id="ref" rows="2" placeholder="Calle, número y referencias de tu casa"></textarea>
<div class="total"><span>Total</span><span id="tot">$0</span></div>
<button class="btn" id="enviar">Enviar pedido por WhatsApp</button>
<div class="note" id="aviso"></div>
</section>
</main>
<button class="btn" id="go" type="button">Hacer pedido</button>
<script>
// ===== DATOS DEL NEGOCIO: edita solo este bloque =====
const CFG={
  nombre:'El Patrón',
  whatsapp:'522212557542',            // número con lada de país, sin + ni espacios
  direccion:'Calle 20 Norte 9, Barrio de los Remedios, 72377 Puebla, Pue.',
  mapa:'https://maps.app.goo.gl/sazTWmM8HTYzEYvUA',
  horario:'Todos los días desde las 8 am',
  radioKm:2,
  precios:{cabeza:27,lengua:40,refresco:30}
};
// =====================================================
const P=CFG.precios,Q={cabeza:0,lengua:0,refresco:0};let modo='domicilio';
const NAMES={cabeza:'Cemita de cabeza',lengua:'Cemita de lengua',refresco:'Refresco'};
const $=s=>document.querySelector(s),M=n=>'$'+n.toLocaleString('es-MX');
$('#dir').textContent=CFG.direccion;
$('#mapa').href=CFG.mapa;$('#mapa2').href=CFG.mapa;
function draw(){
  $('#menu').innerHTML=Object.keys(NAMES).map(k=>'<div class="row"><span>'+NAMES[k]+'<small>'+(P[k]?M(P[k]):'Precio por definir')+'</small></span><div class="step"><button data-k="'+k+'" data-d="-1" aria-label="Quitar">−</button><b>'+Q[k]+'</b><button data-k="'+k+'" data-d="1" aria-label="Agregar">+</button></div></div>').join('');
  $('#tot').textContent=M(Object.keys(Q).reduce((a,k)=>a+Q[k]*P[k],0));
  $('#ref').style.display=modo==='domicilio'?'block':'none';
  $('#aviso').textContent=modo==='domicilio'?'Entregamos en un radio de '+CFG.radioKm+' km. Al abrirse WhatsApp, comparte tu ubicación en el chat (clip → Ubicación) para confirmar que estás dentro de la zona.':'Tu pedido se prepara para recoger en el puesto. Te avisamos por WhatsApp cuando esté listo.';
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m===modo));
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){Q[b.dataset.k]=Math.max(0,Q[b.dataset.k]+Number(b.dataset.d));draw()}
  else if(b.dataset.m){modo=b.dataset.m;draw()}
  else if(b.id==='enviar'){
    if(!Object.keys(Q).some(k=>Q[k]>0)){alert('Agrega al menos un producto a tu pedido.');return}
    const nombre=$('#nombre').value.trim();
    if(!nombre){alert('Escribe tu nombre para el pedido.');$('#nombre').focus();return}
    if(modo==='domicilio'&&!$('#ref').value.trim()){alert('Escribe tu dirección para la entrega.');$('#ref').focus();return}
    if(/X/.test(CFG.whatsapp)){alert('Falta configurar el número de WhatsApp del negocio.');return}
    const l=Object.keys(Q).filter(k=>Q[k]>0).map(k=>'• '+Q[k]+' '+NAMES[k].toLowerCase()+(Q[k]>1&&k!=='refresco'?'s':'')+(Q[k]>1&&k==='refresco'?'s':''));
    const total=Object.keys(Q).reduce((a,k)=>a+Q[k]*P[k],0);
    const t='Hola, quiero hacer un pedido:\n'+l.join('\n')+'\nTotal: '+M(total)+'\nTipo: '+(modo==='domicilio'?'A domicilio':'Paso a recoger')+'\nNombre: '+nombre+(modo==='domicilio'?'\nDirección: '+$('#ref').value.trim()+'\n(Te comparto mi ubicación en el siguiente mensaje)':'');
    window.open('https://wa.me/'+CFG.whatsapp+'?text='+encodeURIComponent(t),'_blank');
  }
});
draw();

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
const go=$('#go'),pe=$('#pedido');
new IntersectionObserver(es=>go.classList.toggle('off',es[0].isIntersecting),{threshold:.1}).observe(pe);
go.addEventListener('click',()=>pe.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}));
</script>
</body>
</html>
